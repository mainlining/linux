%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw21018.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW21018 LED driver

maintainers:
  - Vasiliy Doylov <neko@altlinux.org>

description: |
  The AW21018 is an I2C-controlled 18-channel (6 x RGB) LED driver with
  individually controlled outputs and 8/9/12-bit PWM brightness resolution.

properties:
  compatible:
    const: awinic,aw21018

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  enable-gpios:
    maxItems: 1

  awinic,global-current:
    $ref: /schemas/types.yaml#/definitions/uint8
    default: 102
    description: |
      Global LED current in arbitrary register units (0-255).
      Defaults to 102 (0x66) if not specified.

  awinic,osc-clock:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3, 4, 5, 6, 7]
    default: 0
    description: |
      OSC clock frequency selection written to GCR CLKFRQ field.
      0 = 16MHz (default), 1 = 8MHz, 2 = 1MHz, 3 = 512KHz,
      4 = 256KHz, 5 = 125KHz, 6 = 62.5KHz, 7 = 31.25KHz.

  awinic,brightness-resolution:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3]
    default: 0
    description: |
      PWM brightness resolution written to GCR PWMRES field.
      0 = 8-bit (0-255), 1 = 9-bit (0-511),
      2 = 12-bit (0-4095), 3 = 9+3 bit (0-4095).

  awinic,sl-values:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 1
    maxItems: 18
    description: |
      Per-channel SL (single LED scale) register values (0-255).
      These calibrate the brightness output of each channel to account
      for hardware variations. Length must match the number of child
      LED nodes. If not specified, all channels default to 255 (0xFF).

patternProperties:
  "^led@[0-9a-f]+$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        minimum: 0
        maximum: 17

    required:
      - reg

allOf:
  - $ref: common.yaml#

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@20 {
            compatible = "awinic,aw21018";
            reg = <0x20>;
            #address-cells = <1>;
            #size-cells = <0>;
            enable-gpios = <&tlmm 20 GPIO_ACTIVE_HIGH>;
            awinic,global-current = /bits/ 8 <0x66>;
            awinic,osc-clock = <0>;
            awinic,brightness-resolution = <0>;

            led@0 {
                reg = <0x0>;
                color = <LED_COLOR_ID_RED>;
                function = LED_FUNCTION_STATUS;
            };

            led@1 {
                reg = <0x1>;
                color = <LED_COLOR_ID_GREEN>;
                function = LED_FUNCTION_STATUS;
            };

            led@2 {
                reg = <0x2>;
                color = <LED_COLOR_ID_BLUE>;
                function = LED_FUNCTION_STATUS;
            };
        };
    };

...

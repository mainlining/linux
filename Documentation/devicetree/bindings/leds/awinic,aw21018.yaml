%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw21018.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW21018 LED driver

maintainers:
  - Vasiliy Doylov <neko@altlinux.org>

description: |
  The AW21018 is an I2C-controlled 18-channel (6 x RGB) LED driver with
  individually controlled outputs and 12-bit PWM brightness resolution.

properties:
  compatible:
    const: awinic,aw21018

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  enable-gpios:
    maxItems: 1

  awinic,global-current:
    $ref: /schemas/types.yaml#/definitions/uint8
    description: |
      Value of the global current control register (GCCR), 0-255. It sets the
      maximum output current of all channels; the absolute current depends on
      the external resistor REXT and is 40 mA at the maximum setting.
      Individual channels are further scaled by the led-scale property.
      A raw register value is used instead of led-max-microamp because the
      chip documentation does not provide a conversion between the register
      value and the output current.

patternProperties:
  "^led@[0-9a-f]+$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        minimum: 0
        maximum: 17

      led-scale:
        $ref: /schemas/types.yaml#/definitions/uint8
        default: 255
        description: |
          Per-channel current scale written to the SL register. Values 0-255
          scale the LED output of the channel on top of the global current,
          to account for hardware variations, 255 is full scale.
          Defaults to 255 (0xFF).

    required:
      - reg

allOf:
  - $ref: common.yaml#

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"
  - awinic,global-current

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@20 {
            compatible = "awinic,aw21018";
            reg = <0x20>;
            #address-cells = <1>;
            #size-cells = <0>;
            enable-gpios = <&tlmm 20 GPIO_ACTIVE_HIGH>;
            awinic,global-current = /bits/ 8 <0x66>;

            led@0 {
                reg = <0x0>;
                color = <LED_COLOR_ID_RED>;
                function = LED_FUNCTION_STATUS;
                led-scale = /bits/ 8 <0xff>;
            };

            led@1 {
                reg = <0x1>;
                color = <LED_COLOR_ID_GREEN>;
                function = LED_FUNCTION_STATUS;
                led-scale = /bits/ 8 <0x80>;
            };

            led@2 {
                reg = <0x2>;
                color = <LED_COLOR_ID_BLUE>;
                function = LED_FUNCTION_STATUS;
                led-scale = /bits/ 8 <0x80>;
            };
        };
    };

...
